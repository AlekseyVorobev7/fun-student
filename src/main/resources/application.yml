server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    allow-circular-references: true
  application:
    name: student
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/students_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      schema: students_schema
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS students_schema;
      connection-timeout: 10000
